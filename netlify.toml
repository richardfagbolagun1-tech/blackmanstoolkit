# Netlify config for The Black Man's Toolkit
# Plain static site, no build step. Publish from the repo root.

[build]
  publish = "."
  command = ""

# ---- Pretty URLs (optional: lets /quiz work as well as /quiz.html) ----
[[redirects]]
  from = "/quiz"
  to = "/quiz.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/resources"
  to = "/resources.html"
  status = 200

[[redirects]]
  from = "/bookmarks"
  to = "/bookmarks.html"
  status = 200

[[redirects]]
  from = "/lgbtq"
  to = "/lgbtq.html"
  status = 200

[[redirects]]
  from = "/listen-watch"
  to = "/listen-watch.html"
  status = 200

[[redirects]]
  from = "/print"
  to = "/print.html"
  status = 200

[[redirects]]
  from = "/chapters/:slug"
  to = "/chapters/:slug.html"
  status = 200

[[redirects]]
  from = "/tools"
  to = "/tools/index.html"
  status = 200

[[redirects]]
  from = "/tools/:slug"
  to = "/tools/:slug.html"
  status = 200

# ---- Cache static assets ----
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# ---- Security headers ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
