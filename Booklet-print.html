<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Black Man's Toolkit · Booklet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A1F44;
    --ink-2:#1F3A78;
    --ink-soft:#5A6A8C;
    --paper:#FFFFFF;
    --rule:rgba(10,31,68,.16);
    --rule-strong:rgba(10,31,68,.55);
    --accent:#C89B3C;

    --page-w:148mm;
    --page-h:210mm;

    /* universal safe margin grid */
    --m-top:20mm;
    --m-bot:18mm;
    --m-out:18mm;   /* outside */
    --m-in:20mm;    /* binding side */
    --gutter:6mm;
  }

  @page{ size:148mm 210mm; margin:0; }
  @media print {
    html,body{ background:white; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .stage{ background:none; padding:0; gap:0 !important; }
    .spread{ display:contents; box-shadow:none !important; gap:0 !important; }
    .page{
      margin:0 !important;
      box-shadow:none !important;
      page-break-after:always;
      break-after:page;
      page-break-inside:avoid;
      break-inside:avoid;
      width:148mm !important;
      height:210mm !important;
    }
    .page:last-of-type{ page-break-after:auto; break-after:auto; }
    .controls,.viewer-note,.section-tag{ display:none !important; }
    .spread .page::before{ display:none !important; }
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:#1a1a1a;
    color:var(--ink);
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-feature-settings:"liga","kern","onum";
    -webkit-font-smoothing:antialiased;
  }

  .stage{
    padding:36px 24px 96px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:24px;
  }

  /* single-page stacked view */
  .spread{
    display:flex;
    flex-direction:column;
    gap:24px;
    background:transparent;
    box-shadow:none;
  }
  .spread .page{
    box-shadow:0 24px 60px -20px rgba(0,0,0,.55), 0 6px 18px rgba(0,0,0,.30);
  }

  /* ===== Base page (universal safe margin grid) ===== */
  .page{
    width:var(--page-w);
    height:var(--page-h);
    background:var(--paper);
    position:relative;
    overflow:hidden;
    color:var(--ink);
    font-size:9.5pt;
    line-height:1.5;
    display:grid;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "header"
      "body"
      "footer";
  }
  /* uniform symmetric margins for single-page layout */
  .page.recto, .page.verso{ padding:var(--m-top) var(--m-out) var(--m-bot) var(--m-out); }

  .page > .p-header{ grid-area:header; }
  .page > .p-body{
    grid-area:body;
    min-height:0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .page > .p-footer{
    grid-area:footer;
    padding-top:6mm;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }
  .page > .p-footer .folio{
    font-family:"JetBrains Mono", monospace;
    font-size:7pt;
    color:var(--ink-soft);
    letter-spacing:.1em;
  }
  .page > .p-footer .footnote{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:500;
    font-size:7pt;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  /* single-page view: no gutter shadow needed */

  /* ===== Header bar ===== */
  .p-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:500;
    font-size:7pt;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ink-soft);
    padding-bottom:5mm;
    border-bottom:0.5px solid var(--rule);
  }
  .p-header.empty{ border-bottom:0; padding-bottom:0; min-height:0; }
  .p-header .h-meta{ font-family:"JetBrains Mono", monospace; letter-spacing:.1em; }

  /* ===== Type system ===== */
  .eyebrow{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:500;
    font-size:7.5pt;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .eyebrow.accent{ color:var(--accent); }
  .mono{ font-family:"JetBrains Mono", monospace; font-size:7pt; letter-spacing:.06em; }
  .rule{ height:1px; background:var(--rule); border:0; margin:0; }
  .rule-strong{ height:1.5px; background:var(--rule-strong); border:0; margin:0; }
  .rule-accent{ height:3px; background:var(--accent); border:0; width:36mm; }

  p.body{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-size:9.5pt;
    line-height:1.5;
    text-wrap:pretty;
    hyphens:auto;
    margin:0 0 3mm;
  }
  p.body.lede{ font-size:10.5pt; line-height:1.45; }

  .h-display{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:200;
    letter-spacing:-0.035em;
    line-height:.95;
    color:var(--ink);
    margin:0;
  }
  .h-display b{ font-weight:800; }
  .h-display i{ font-style:italic; font-weight:300; }

  .h-section-title{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:700;
    font-size:24pt;
    line-height:1;
    letter-spacing:-0.025em;
    margin:0;
    color:var(--ink);
  }

  .dropcap::first-letter{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:700;
    font-size:36pt;
    line-height:.78;
    float:left;
    padding:4pt 5pt 0 0;
    color:var(--ink);
  }

  .pullquote{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:300;
    font-size:15pt;
    line-height:1.15;
    letter-spacing:-0.02em;
    color:var(--ink);
    text-wrap:balance;
    margin:0;
  }
  .pullquote .mark{ color:var(--accent); font-weight:600; }

  /* ===== Section header pattern (consistent across all body pages) ===== */
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:3mm;
  }
  .section-head .lhs{ display:flex; flex-direction:column; gap:1.5mm; }
  .section-head .label{ font-family:'EB Garamond', Garamond, "Times New Roman", serif; font-weight:500; font-size:7.5pt; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-soft); }
  .section-head .title{ font-family:'EB Garamond', Garamond, "Times New Roman", serif; font-weight:600; font-size:13pt; letter-spacing:-0.01em; color:var(--ink); }
  .section-head .rhs{ font-family:"JetBrains Mono",monospace; font-size:7pt; color:var(--ink-soft); letter-spacing:.08em; }

  .body-pad{ margin-top:6mm; flex:1; min-height:0; display:flex; flex-direction:column; }

  /* ===== COVER ===== */
  .cover{ display:block; padding:0; overflow:hidden; position:relative; background:#E8E8E6; }
  .cover-inner{
    width:100%; height:100%;
    padding:30mm 22mm;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    background:#E8E8E6;
  }
  .cover .titlewrap{
    font-family:"Outfit", sans-serif;
    font-weight:600;
    font-size:62pt;
    line-height:.95;
    letter-spacing:-0.035em;
    color:var(--ink);
  }
  .cover .titlewrap span{
    display:block;
    font-weight:600;
    font-style:normal;
    font-size:inherit;
  }

  /* ===== TITLE PAGE ===== */
  .title-page-body{ display:grid; grid-template-rows:auto 1fr auto; height:100%; }
  .title-page-body .center{ align-self:center; }
  .title-page-body .titlewrap{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:200;
    line-height:.92;
    letter-spacing:-0.04em;
    color:var(--ink);
    font-size:38pt;
  }
  .title-page-body .titlewrap .the{ display:block; font-weight:300; font-size:32pt; opacity:.85; }
  .title-page-body .titlewrap .bm{ display:block; font-style:italic; font-weight:300; }
  .title-page-body .titlewrap .tk{ display:block; font-weight:800; }

  /* ===== Colophon ===== */
  .meta-grid{
    display:grid; grid-template-columns:30mm 1fr; gap:3mm 6mm;
    font-size:8.5pt; line-height:1.5;
  }
  .meta-grid dt{ font-family:'EB Garamond', Garamond, "Times New Roman", serif; font-weight:500; font-size:7pt; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); }
  .meta-grid dd{ margin:0; font-family:'EB Garamond', Garamond, "Times New Roman", serif; }

  /* ===== Contents ===== */
  .toc-list{ display:grid; gap:0; }
  .toc-row{
    display:grid;
    grid-template-columns:14mm 1fr auto;
    align-items:baseline;
    gap:5mm;
    padding:3mm 0;
    border-bottom:1px solid var(--rule);
  }
  .toc-row .num{ font-family:"JetBrains Mono",monospace; font-size:8pt; color:var(--accent); letter-spacing:.05em; }
  .toc-row .chap{ font-family:'EB Garamond', Garamond, "Times New Roman", serif; font-weight:600; font-size:13pt; letter-spacing:-0.015em; color:var(--ink); }
  .toc-row .chap small{
    display:block;
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-size:8pt; font-weight:400; color:var(--ink-soft);
    margin-top:1mm; font-style:italic; line-height:1.3; letter-spacing:0;
    max-width:84mm; text-wrap:pretty;
  }
  .toc-row .pg{ font-family:"JetBrains Mono",monospace; font-size:9pt; color:var(--ink); font-weight:500; }

  .toc-row.aux .chap{ font-size:12pt; font-weight:500; }

  /* ===== Chapter opener ===== */
  .opener-body{
    display:flex;
    flex-direction:column;
    height:100%;
    padding-bottom:70mm; /* reserve space for absolutely-positioned image */
  }
  .opener-body .opener-label{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:500;
    font-size:9pt;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-top:4mm;
  }
  .opener-body .opener-title{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:800;
    font-size:54pt;
    line-height:.9;
    letter-spacing:-0.045em;
    margin:3mm 0 0;
    color:var(--ink);
  }
  .opener-body .opener-rule{
    width:36mm; height:3px; background:var(--accent); border:0;
    margin:6mm 0;
  }
  .opener-body .opener-quote{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-style:italic;
    font-weight:400;
    font-size:12pt;
    line-height:1.35;
    letter-spacing:-0.005em;
    color:var(--ink);
    text-wrap:balance;
    max-width:108mm;
    margin:0 0 6mm;
  }
  .opener-body .opener-summary{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:400;
    font-size:8.5pt;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--ink-soft);
    line-height:1.7;
    margin:0;
  }
  .opener-body .opener-summary b{ font-weight:700; color:var(--ink); }
  .opener-body .opener-image{
    position:absolute;
    left:0; right:0; bottom:0;
    width:var(--page-w);
    height:64mm;
    background:#0A1F44;
    overflow:hidden;
    z-index:1;
  }
  .opener-body .opener-image::before{
    content:"";
    position:absolute; inset:0;
    background-size:cover; background-position:center;
    background-image:var(--bg);
    filter:grayscale(1) contrast(1.05);
  }
  .opener-body .opener-image::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,31,68,.20) 0%, rgba(10,31,68,.55) 100%);
    mix-blend-mode:multiply;
  }
  .opener-body .opener-image .caption-row{
    position:absolute; left:18mm; right:18mm; bottom:12mm;
    display:flex; justify-content:space-between; align-items:flex-end;
    z-index:2;
    color:#fff;
  }
  .opener-body .opener-image .caption-row .nm{ font-family:'EB Garamond', Garamond, "Times New Roman", serif; font-weight:600; font-size:14pt; letter-spacing:-0.005em; }
  .opener-body .opener-image .caption-row .cap{ font-family:"JetBrains Mono",monospace; font-size:7pt; letter-spacing:.1em; text-transform:uppercase; opacity:.85; }

  /* ===== Essay typography ===== */
  .essay-body p.body{ font-size:10pt; line-height:1.55; }
  .essay-body p.body + p.body{ margin-top:0; }
  .essay-body p.body.indent + p.body.indent{ text-indent:1.2em; margin-top:0; }

  /* ===== Stats ===== */
  .stats-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:5mm; }
  .stats-grid .stat{ border-top:2px solid var(--ink); padding-top:3mm; }
  .stats-grid .stat .n{ font-family:'EB Garamond', Garamond, "Times New Roman", serif; font-weight:700; font-size:26pt; line-height:1; letter-spacing:-0.04em; color:var(--ink); }
  .stats-grid .stat .lbl{ font-size:8pt; line-height:1.4; color:var(--ink-2); margin-top:2.5mm; font-family:'EB Garamond', Garamond, "Times New Roman", serif; }

  /* ===== Questions ===== */
  .q-list{ display:grid; gap:0; counter-reset:q; margin:0; padding:0; list-style:none; }
  .q-list li{
    counter-increment:q;
    display:grid;
    grid-template-columns:11mm 1fr;
    gap:3mm;
    padding:2.5mm 0;
    border-bottom:1px solid var(--rule);
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:400;
    font-size:9.5pt;
    line-height:1.35;
    letter-spacing:-0.005em;
    text-wrap:pretty;
  }
  .q-list li::before{
    content: counter(q,decimal-leading-zero);
    font-family:"JetBrains Mono",monospace;
    font-size:8pt;
    font-weight:400;
    color:var(--accent);
    padding-top:1.5mm;
    letter-spacing:.04em;
  }
  .q-list li:last-child{ border-bottom:0; }

  /* ===== Actions ===== */
  .a-list{ display:grid; gap:0; }
  .a-list .item{
    padding:2.5mm 0;
    border-bottom:1px solid var(--rule);
  }
  .a-list .item:last-child{ border-bottom:0; }
  .a-list .head{ display:grid; grid-template-columns:11mm 1fr; gap:3mm; align-items:baseline; }
  .a-list .n{
    font-family:"JetBrains Mono",monospace;
    font-size:7.5pt;
    color:var(--accent);
    letter-spacing:.04em;
  }
  .a-list .t{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:600;
    font-size:10pt;
    letter-spacing:-0.01em;
    line-height:1.2;
    color:var(--ink);
  }
  .a-list .d{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-size:8.5pt;
    line-height:1.4;
    margin:1mm 0 0 14mm;
    color:var(--ink-2);
  }

  /* ===== Directory ===== */
  .dir{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    column-gap:6mm;
    row-gap:0;
  }
  .dir .group{ break-inside:avoid; padding:3mm 0 4mm; border-bottom:1px solid var(--rule); }
  .dir .group:nth-last-child(-n+3){ border-bottom:0; }
  .dir .group .ghead{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:700;
    font-size:9pt;
    letter-spacing:-0.005em;
    color:var(--ink);
    margin-bottom:2mm;
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:1.5px solid var(--ink);
    padding-bottom:1mm;
  }
  .dir .group .ghead .num{
    font-family:"JetBrains Mono",monospace;
    font-size:7pt; color:var(--accent); letter-spacing:.06em;
  }
  .dir .group .item{
    margin-bottom:1.8mm;
  }
  .dir .group .item .nm{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:600;
    font-size:8pt;
    letter-spacing:-0.005em;
    color:var(--ink);
    line-height:1.2;
  }
  .dir .group .item .nm .bl{
    display:inline-block;
    font-family:"JetBrains Mono",monospace;
    font-size:5pt;
    color:var(--accent);
    letter-spacing:.1em;
    text-transform:uppercase;
    vertical-align:1px;
    margin-left:1.5mm;
  }
  .dir .group .item .ds{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-style:italic;
    font-weight:400;
    font-size:7pt;
    color:var(--ink-2);
    line-height:1.3;
    margin-top:0.3mm;
  }
  .dir .group .item{ margin-bottom:1.5mm; }

  /* ===== Crisis page (full navy) ===== */
  .crisis{
    background:var(--ink);
    color:var(--paper);
    padding:var(--m-top) var(--m-in) var(--m-bot) var(--m-out);
    grid-template-rows: auto 1fr auto;
  }
  .crisis.recto{ padding:var(--m-top) var(--m-out) var(--m-bot) var(--m-in); }
  .crisis .p-header{ color:rgba(255,255,255,.7); border-bottom-color:rgba(255,255,255,.18); }
  .crisis h2.h-display{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:200;
    font-size:38pt;
    line-height:.95;
    letter-spacing:-0.035em;
    margin:0;
    color:#fff;
  }
  .crisis h2.h-display b{ font-weight:800; }
  .crisis .lede{ color:rgba(255,255,255,.85); font-family:'EB Garamond', Garamond, "Times New Roman", serif; font-style:italic; font-size:11.5pt; line-height:1.45; max-width:100mm; }
  .crisis .lines{ display:grid; gap:0; }
  .crisis .line-row{
    display:grid; grid-template-columns:1fr auto; gap:5mm;
    padding:2.5mm 0;
    border-bottom:1px solid rgba(255,255,255,.18);
    align-items:baseline;
  }
  .crisis .line-row:last-child{ border-bottom:0; }
  .crisis .line-row .n{ font-family:'EB Garamond', Garamond, "Times New Roman", serif; font-weight:600; font-size:11pt; letter-spacing:-0.01em; color:#fff; }
  .crisis .line-row .d{ font-family:'EB Garamond', Garamond, "Times New Roman", serif; font-size:8.5pt; opacity:.75; margin-top:0.5mm; max-width:80mm; line-height:1.35; font-style:italic; }
  .crisis .line-row .num{ font-family:"JetBrains Mono",monospace; font-size:11pt; color:#E8D9C2; letter-spacing:.04em; }
  .crisis .p-footer .folio{ color:rgba(255,255,255,.6); }
  .crisis .p-footer .footnote{ color:rgba(255,255,255,.65); }

  /* ===== Back cover (full navy) ===== */
  .back{
    background:var(--ink);
    color:var(--paper);
    padding:0;
    display:block;
    overflow:hidden;
  }
  .back .back-inner{
    width:100%; height:100%;
    padding:20mm 18mm;
    display:grid; grid-template-rows:auto 1fr auto;
  }
  .back .top{
    display:flex; justify-content:space-between; align-items:flex-start;
    font-family:"JetBrains Mono", monospace;
    font-size:7.5pt; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(255,255,255,.65);
    line-height:1.6;
  }
  .back .pull{
    align-self:center;
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-weight:200;
    font-size:24pt; line-height:1.1; letter-spacing:-0.025em;
    max-width:108mm;
    color:#fff;
    text-wrap:balance;
  }
  .back .pull b{ font-weight:700; }
  .back .pull i{ font-style:italic; font-weight:300; }
  .back .pull p{ margin:0 0 5mm; }
  .back .pull .strap{
    font-family:'EB Garamond', Garamond, "Times New Roman", serif;
    font-style:italic;
    font-weight:400;
    font-size:11pt;
    color:rgba(255,255,255,.85);
    line-height:1.45;
    margin-top:5mm;
  }
  .back .bot{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-top:2px solid rgba(255,255,255,.35);
    padding-top:5mm;
    font-family:"JetBrains Mono", monospace;
    font-size:7.5pt; letter-spacing:.18em; text-transform:uppercase;
    color:rgba(255,255,255,.65);
    line-height:1.6;
  }

  /* ===== Inside-front plate (full-bleed portrait, p.2) ===== */
  .plate-page{ display:block; padding:0; overflow:hidden; }
  .plate-page .plate-img{
    width:100%; height:100%;
    background:#0A1F44 center/cover no-repeat;
    background-image:var(--bg);
    position:relative;
  }
  .plate-page .plate-img::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(10,31,68,.25) 0%, rgba(10,31,68,.55) 100%);
  }
  .plate-page .plate-caption{
    position:absolute;
    left:16mm; right:16mm; bottom:12mm;
    color:#fff;
    font-family:'EB Garamond', Garamond, serif;
    font-style:italic;
    font-weight:400;
    font-size:13pt;
    line-height:1.35;
    text-wrap:balance;
    z-index:2;
    max-width:108mm;
  }

          <div style="display:grid; grid-template-columns:11mm 1fr; gap:3mm; padding:3mm 0; border-bottom:1px solid var(--rule)"><div class="mono" style="color:var(--accent); padding-top:1mm">/02</div><div><div style="font-family:'EB Garamond'; font-weight:600; font-size:11pt">The numbers</div><div style="font-family:'EB Garamond'; font-size:9pt; line-height:1.45; margin-top:1mm; color:var(--ink-2)">UK data, honest, useful.</div></div></div>

function pForeword1(){
  return `
  <div class="page recto">
    ${pageHeader('','')}
    <div class="p-body">
      <div class="body-pad">
        <div class="eyebrow">A letter from the editors</div>

        <p class="body lede dropcap" style="margin-top:6mm">Welcome. Take a breath. You have opened something that was built with you in mind.</p>
        <p class="body" style="font-size:10pt">This toolkit is a gift from Lambeth, South London, to Black men everywhere, but it started close to home. It is the work of <b>Black Thrive Lambeth</b>, a partnership founded in 2016 between Lambeth Council, South London and Maudsley NHS Foundation Trust, and a coalition of community organisations who were tired of seeing the same story on repeat.</p>
        <p class="body" style="font-size:10pt">Much of that energy carries the memory of <b>Sean Rigg</b>, a 40-year-old Black man and talented musician who died in Brixton police custody in August 2008 after a mental-health crisis. His family's long fight for truth is one of the reasons this work exists at all.</p>
      </div>
    </div>
    ${pageFooter('07','')}
  </div>`;
}

function pForeword2(){
  return `
  <div class="page verso">
    ${pageHeader('','')}
    <div class="p-body">
      <div class="body-pad">
        <p class="body lede dropcap" style="margin-top:0">We see you. We know the weight you carry. We know what it feels like to be told from boyhood to "man up," to hold it down for family, to be the rock while quietly cracking. We know the side-eye you get at the GP, the letters from the bank that pile up in the drawer, the sleepless nights you never talk about.</p>
        <p class="body" style="font-size:10pt">This toolkit will not lecture you. It will not pretend racism does not exist or that one walk a day fixes everything. What it will do is give you six honest conversations: about your body, your mind, your money, your spirit, your brothers, and your community.</p>
        <p class="body" style="font-size:10pt">Use this at your pace. Skip around. Share it with a brother, a cousin, a son. There is no right way to use this, except honestly.</p>
        <hr class="rule-accent" style="margin-top:6mm">
        <p style="font-family:'EB Garamond'; font-weight:500; font-size:13pt; line-height:1.25; letter-spacing:-0.01em; margin-top:5mm; text-wrap:balance">You deserve a long life, a clear mind, a stable future, a known soul, real brothers, and a community you helped build.</p>
      </div>
    </div>
    ${pageFooter('08','')}
  </div>`;
}

/* Chapter pages */

function chapterPages(c, startPage){
  // 6 pages: opener-recto, essay1-verso, essay2-recto, numbers-verso, questions-recto, actions-verso
  // startPage is the opener page (odd, recto).
  const p1 = startPage;
  const p2 = startPage+1;
  const p3 = startPage+2;
  const p4 = startPage+3;
  const p5 = startPage+4;
  const p6 = startPage+5;

  const opener = `
  <div class="page recto">
    ${pageHeader('','')}
    <div class="p-body">
      <div class="opener-body" style="--bg:url('${c.image}')">
        <div class="opener-label">Chapter ${c.n}</div>
        <h2 class="opener-title">${c.name}</h2>
        <hr class="opener-rule">
        <div class="opener-quote">“${c.quote}”</div>
        <div class="opener-summary">A short essay, seven questions, and a list of small actions.</div>
        <div class="opener-image">
          <div class="caption-row">
            <div class="nm">${c.character.name}</div>
            <div class="cap">Photograph to be commissioned</div>
          </div>
        </div>
      </div>
    </div>
    ${pageFooter(num(p1), '')}
  </div>`;

  const essay1 = `
  <div class="page verso">
    ${pageHeader(c.name, '')}
    <div class="p-body">
      <div class="body-pad">
        <div class="section-head">
          <div class="lhs">
            <span class="label">The story</span>
            <span class="title">${c.character.name}</span>
          </div>
        </div>
        <hr class="rule-strong">
        <div style="margin-top:5mm" class="essay-body">
          <p class="body lede dropcap">${c.essay[0]}</p>
          <p class="body">${c.essay[1]}</p>
        </div>
      </div>
    </div>
    ${pageFooter(num(p2), '')}
  </div>`;

  const essay2 = `
  <div class="page recto">
    ${pageHeader(c.name, '')}
    <div class="p-body">
      <div class="body-pad">
        <div class="section-head">
          <div class="lhs">
            <span class="label">The story, continued</span>
            <span class="title">${c.character.name}</span>
          </div>
        </div>
        <hr class="rule-strong">
        <div style="margin-top:5mm" class="essay-body">
          <p class="body">${c.essay[2]}</p>
          <div class="pullquote" style="margin:6mm 0; max-width:108mm"><span class="mark">“</span>${c.quote.replace(/^"|"$/g,'')}<span class="mark">”</span></div>
          <p class="body">${c.essay[3]}</p>
        </div>
      </div>
    </div>
    ${pageFooter(num(p3), '')}
  </div>`;

  const numbers = `
  <div class="page verso">
    ${pageHeader(c.name, '')}
    <div class="p-body">
      <div class="body-pad">
        <div class="section-head">
          <div class="lhs">
            <span class="label">By the numbers</span>
            <span class="title">${c.name}, in UK data</span>
          </div>
        </div>
        <hr class="rule-strong">
        <div class="stats-grid" style="margin-top:8mm">
          ${c.stats.map(s=>`<div class="stat"><div class="n">${s.n}</div><div class="lbl">${s.l}</div></div>`).join('')}
        </div>
        <p class="body" style="font-style:italic; color:var(--ink-soft); margin-top:auto; font-size:9.5pt; max-width:100mm">
          The numbers are not destiny. They are context. They tell us where the road is hardest, so we know where to look out for one another.
        </p>
      </div>
    </div>
    ${pageFooter(num(p4), '')}
  </div>`;

  const questions = `
  <div class="page recto">
    ${pageHeader(c.name, '')}
    <div class="p-body">
      <div class="body-pad">
        <div class="section-head">
          <div class="lhs">
            <span class="label">Questions for yourself</span>
            <span class="title">Seven things to ask</span>
          </div>
        </div>
        <hr class="rule-strong">
        <p class="body" style="font-style:italic; font-size:9pt; color:var(--ink-soft); margin:4mm 0 4mm">The point is not to answer them quickly. Sit with one if it lands.</p>
        <ol class="q-list">${c.questions.map(q=>`<li>${q}</li>`).join('')}</ol>
      </div>
    </div>
    ${pageFooter(num(p5), '')}
  </div>`;

  const actions = `
  <div class="page verso">
    ${pageHeader(c.name, '')}
    <div class="p-body">
      <div class="body-pad">
        <div class="section-head">
          <div class="lhs">
            <span class="label">Small actions</span>
            <span class="title">Five things you might do</span>
          </div>
        </div>
        <hr class="rule-strong">
        <p class="body" style="font-style:italic; font-size:9pt; color:var(--ink-soft); margin:4mm 0 4mm">Pick one. Pick none. Skip ahead. Resources for every chapter are gathered at the back of the book.</p>
        <div class="a-list">
          ${c.actions.map((a,i)=>`<div class="item"><div class="head"><div class="n">/${num(i+1)}</div><div class="t">${a.t.replace(/\.$/,'')}</div></div><div class="d">${a.d}</div></div>`).join('')}
        </div>
      </div>
    </div>
    ${pageFooter(num(p6), '')}
  </div>`;

  return [opener, essay1, essay2, numbers, questions, actions];
}

/* Back matter */

function pClosing(){
  return `
  <div class="page recto">
    ${pageHeader('','')}
    <div class="p-body">
      <div class="body-pad">
        <div class="eyebrow">Closing</div>
        <hr class="rule-accent" style="margin:4mm 0 6mm">
        <p class="body lede" style="font-family:'EB Garamond'; font-weight:500; font-size:17pt; line-height:1.2; letter-spacing:-0.005em; max-width:110mm; margin:0 0 5mm">Leon, Darius, Andre, Marcus, Kevin, and Sean are not real, but you know them. <i style="font-style:italic">You might be them, or you might be the man they need to call.</i></p>
        <div class="side-img" style="--bg:url('images/portrait-kevin.jpg'); aspect-ratio:16/9; margin:5mm 0 5mm"></div>
        <p class="body" style="font-size:10pt">Looking after your body, your mind, your money, your spirit, your brothers, and your community is not vanity, selfishness, or soft. It is the work of a whole man. It is how you stay alive for the people who love you, and how you become the kind of ancestor your grandchildren will be proud of.</p>
        <p class="body" style="font-size:10pt">Take the first step this week. One phone call. One walk. One conversation. One honest look at the bank statement. One quiet ten minutes. One Monday at Andy's Man Club. One school governor application. One small act, on purpose.</p>
        <div style="margin-top:auto">
          <hr class="rule-accent" style="margin-bottom:4mm">
          <div style="font-family:'EB Garamond'; font-weight:600; font-size:14pt; letter-spacing:-0.01em">We are with you.</div>
          <div class="mono" style="color:var(--ink-soft); margin-top:2mm; letter-spacing:.18em">BLACK THRIVE LAMBETH · 2026</div>
        </div>
      </div>
    </div>
    ${pageFooter('45','')}
  </div>`;
}

      <div class="body-pad">

          <div class="lhs">

function pBackCover(){
  return `
  <div class="page verso back">
    <div class="back-inner">
      <div class="top">
        <div>Black Thrive Lambeth</div>
        <div style="text-align:right">Designed by<br>The Office of<br>Art &amp; Technology</div>
      </div>
      <div class="pull">

        <div style="text-align:right">148 × 210 mm<br>48 pages</div>
      </div>
    </div>
  </div>`;

/* =====================================================================
   ASSEMBLY: single-page stack in book reading order
   ===================================================================== */

const startPages = [9,15,21,27,33,39];
const chapterContent = CHAPTERS.map((c,i)=>chapterPages(c, startPages[i]));

let html = '';
html += `<div class="section-tag">Cover · p. 1</div><div class="spread">${pCover()}</div>`;
html += `<div class="section-tag">Inside front · p. 2</div><div class="spread">${pInsideFront()}</div>`;
html += `<div class="section-tag">Title · p. 3</div><div class="spread">${pTitle()}</div>`;
html += `<div class="section-tag">Colophon · p. 4</div><div class="spread">${pColophon()}</div>`;
html += `<div class="section-tag">Contents · p. 5</div><div class="spread">${pContents()}</div>`;
html += `<div class="section-tag">How to use · p. 6</div><div class="spread">${pHowToUse()}</div>`;
html += `<div class="section-tag">Foreword · p. 7</div><div class="spread">${pForeword1()}</div>`;
html += `<div class="section-tag">Foreword, continued · p. 8</div><div class="spread">${pForeword2()}</div>`;

chapterContent.forEach((pages, i)=>{
  const c = CHAPTERS[i];
  const start = startPages[i];
  const labels = ['opener','the story','the story, continued','by the numbers','questions','small actions'];
  pages.forEach((p, j)=>{
    html += `<div class="section-tag">Chapter ${c.n} · ${c.name} · ${labels[j]} · p. ${start+j}</div><div class="spread">${p}</div>`;
  });
});

html += `<div class="section-tag">Closing · p. 45</div><div class="spread">${pClosing()}</div>`;
html += `<div class="section-tag">Help, now · p. 46</div><div class="spread">${pCrisis()}</div>`;
html += `<div class="section-tag">Directory · p. 47</div><div class="spread">${pDirectory()}</div>`;
html += `<div class="section-tag">Back cover · p. 48</div><div class="spread">${pBackCover()}</div>`;

document.getElementById('book').innerHTML = html;

/* ===== Auto-print after fonts + layout ready ===== */
(async () => {
  try { await document.fonts.ready; } catch(e) {}
  // Wait one frame for layout to settle
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  // Extra delay so images decode
  const imgWaits = Array.from(document.querySelectorAll('img')).map(img => img.complete ? null : new Promise(res => img.addEventListener('load', res, {once:true})));
  await Promise.all(imgWaits);
  await new Promise(r => setTimeout(r, 600));
  window.print();
})();
</script>
