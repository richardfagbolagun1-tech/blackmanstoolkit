<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Where to start | The Black Man's Toolkit</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<header class="site-header">
  <a class="brand" href="index.html"><span class="brand-mark"></span><span class="brand-name">The Black Man's Toolkit</span></a>
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="index.html#chapters">Chapters</a>
    <a href="quiz.html" class="active">Where to start</a>
    <a href="tools/index.html">Tools</a>
    <a href="resources.html">Resources</a>
    <a href="bookmarks.html">Saved</a>
    <a href="about.html">About</a>
  </nav>
</header>

<section class="quiz-shell" data-screen-label="Quiz">
  <div class="quiz-inner">
    <div class="quiz-progress" id="qp"></div>
    <div id="quiz-step"></div>
    <div id="quiz-result" class="quiz-result"></div>
  </div>
</section>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
const QUESTIONS = [
  { q: "Which of these feels heaviest for you right now?", sub: "There is no wrong answer. Pick the one that lands.", opts: [
    { t: "My body is telling me something I have been ignoring", c: "body" },
    { t: "My mind feels heavy or numb, more than I'd admit out loud", c: "mind" },
    { t: "Money is a quiet stress every month", c: "money" },
    { t: "I am not sure who I am underneath the work and obligations", c: "spirit" },
    { t: "I feel isolated, even around people I call my boys", c: "brotherhood" },
    { t: "I see things in my community I want to change", c: "community" },
  ]},
  { q: "When you say 'I'm good', how often is it true?", sub: "Be honest with yourself.", opts: [
    { t: "Most of the time. Things are actually okay.", c: "spirit" },
    { t: "Some of the time. There are heavier days.", c: "mind" },
    { t: "Rarely. I am running on fumes.", c: "mind" },
    { t: "I don't really stop to ask myself.", c: "spirit" },
  ]},
  { q: "Which one would change your life most this year?", sub: "If you could only pick one.", opts: [
    { t: "Better health and a body I trust", c: "body" },
    { t: "Peace of mind and rest", c: "mind" },
    { t: "Financial stability and savings", c: "money" },
    { t: "Knowing who I am and what I am here for", c: "spirit" },
    { t: "Real friendships with other men", c: "brotherhood" },
    { t: "Doing something useful in my area", c: "community" },
  ]},
  { q: "Who is the one person you could tell the whole truth to?", sub: "And how often do you actually do it?", opts: [
    { t: "I have a brother / friend like that, and I do tell him", c: "community" },
    { t: "I have someone, but I do not really open up", c: "brotherhood" },
    { t: "I am not sure I have anyone like that", c: "brotherhood" },
    { t: "My partner. And nobody else.", c: "brotherhood" },
    { t: "Only God / my faith", c: "spirit" },
  ]},
  { q: "If you take one step after closing this page, you want it to be...", sub: "What feels most useful?", opts: [
    { t: "Booking the medical check I have been putting off", c: "body" },
    { t: "Telling someone how I really am", c: "mind" },
    { t: "Sitting down with my actual numbers", c: "money" },
    { t: "Ten quiet minutes with myself", c: "spirit" },
    { t: "Walking into a room of men who get it", c: "brotherhood" },
    { t: "Showing up to something local", c: "community" },
  ]},
];

let step = 0;
const tally = {};
const pickedAnswers = [];

function renderProgress() {
  const qp = document.getElementById("qp");
  qp.innerHTML = QUESTIONS.map((_, i) => `<span class="${i < step ? 'done' : ''}"></span>`).join("");
}

function render() {
  if (step >= QUESTIONS.length) return showResult();
  renderProgress();
  const Q = QUESTIONS[step];
  document.getElementById("quiz-step").innerHTML = `
    <h2 class="quiz-question">${Q.q}</h2>
    <p class="quiz-sub">${Q.sub}</p>
    <div class="quiz-options">
      ${Q.opts.map((o, i) => `<button class="quiz-option" data-i="${i}">${o.t}</button>`).join("")}
    </div>
    <div class="quiz-foot">
      ${step > 0 ? '<button class="quiz-link" id="back">&larr; Back</button>' : '<span></span>'}
      <span style="opacity:.6;font-size:13px">Question ${step + 1} of ${QUESTIONS.length}</span>
    </div>
  `;
  document.querySelectorAll(".quiz-option").forEach(b => {
    b.addEventListener("click", () => {
      const idx = +b.dataset.i;
      const opt = Q.opts[idx];
      tally[opt.c] = (tally[opt.c] || 0) + (step === 0 ? 3 : 1);
      pickedAnswers[step] = idx;
      b.classList.add("selected");
      setTimeout(() => { step++; render(); }, 250);
    });
  });
  if (step > 0) {
    document.getElementById("back").addEventListener("click", () => {
      step--;
      const prevPicked = pickedAnswers[step];
      if (prevPicked != null) {
        const c = QUESTIONS[step].opts[prevPicked].c;
        tally[c] = Math.max(0, (tally[c] || 0) - (step === 0 ? 3 : 1));
      }
      render();
    });
  }
}

function showResult() {
  renderProgress();
  document.getElementById("qp").innerHTML = QUESTIONS.map(() => `<span class="done"></span>`).join("");
  document.getElementById("quiz-step").innerHTML = "";
  const winner = Object.entries(tally).sort((a, b) => b[1] - a[1])[0]?.[0] || "body";
  const top = window.getChapter(winner);
  const others = window.TOOLKIT.chapters.filter(c => c.slug !== winner).slice(0, 3);

  const result = document.getElementById("quiz-result");
  result.classList.add("active");
  result.innerHTML = `
    <h2>Brother, start here.</h2>
    <p>Based on what you told us, the chapter that will matter most for you, right now, is...</p>

    <a class="quiz-recommendation" href="chapters/${top.slug}.html" style="text-decoration:none;color:var(--ink)">
      <img src="${top.portrait}" alt="${top.title}" />
      <div>
        <div class="rec-eyebrow">${top.number} \u00B7 ${top.kicker}</div>
        <h3>${top.title}.</h3>
        <p>${top.promise}</p>
        <span class="btn btn-primary" style="font-size:13px">Read chapter
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </span>
      </div>
    </a>

    <p style="margin:48px 0 16px;font-size:15px;font-style:normal;font-family:var(--sans);font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.7">Then come back to these</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
      ${others.map(o => `
        <a href="chapters/${o.slug}.html" style="text-decoration:none;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);border-radius:14px;padding:20px;display:block;color:var(--paper)">
          <div style="font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.7;font-weight:700;margin-bottom:8px">${o.number} \u00B7 ${o.kicker}</div>
          <div style="font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.015em">${o.title}</div>
          <div style="font-family:var(--serif);font-style:italic;font-size:14px;opacity:.85;margin-top:6px">${o.promise}</div>
        </a>
      `).join("")}
    </div>
    <div style="margin-top:36px"><button class="btn btn-ghost" style="border-color:var(--paper);color:var(--paper)" id="restart">Start over</button></div>
  `;
  document.getElementById("restart").addEventListener("click", () => {
    step = 0;
    Object.keys(tally).forEach(k => delete tally[k]);
    pickedAnswers.length = 0;
    result.classList.remove("active");
    result.innerHTML = "";
    render();
  });
}

render();
</script>
</body>
</html>
